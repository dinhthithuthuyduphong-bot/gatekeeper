name: CI

on:
  push:
    branches: ["main", "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests
        run: pytest --cov=gatekeeper --cov-report=term-missing --cov-fail-under=80 --junitxml=results/junit.xml
      - name: Feasibility simulation (full)
        run: python scripts/run_simulations.py
      - name: Check committed simulation results are reproducible
        run: |
          python - <<'EOF'
          import json, subprocess
          committed = json.loads(subprocess.check_output(["git", "show", "HEAD:results/simulation.json"]))
          fresh = json.load(open("results/simulation.json"))
          key = lambda d: [(r["str_true"], r["alpha"], r["admit_rate"], r["median_trials_admitted"]) for r in d["grid"]]
          assert key(committed) == key(fresh), (key(committed), key(fresh))
          assert committed["type_one_check"]["admit_rate"] == fresh["type_one_check"]["admit_rate"]
          print("simulation.json reproduced exactly")
          EOF
      - uses: actions/upload-artifact@v5
        if: always() && matrix.python == '3.11'
        with:
          name: results-test
          path: results/

  confseq-crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"
      - name: Install Boost (needed to build confseq)
        run: sudo apt-get update -q && sudo apt-get install -y -q libboost-dev
      - name: Install
        run: pip install -e . "numpy<2" confseq  # confseq still uses np.float_ (removed in NumPy 2.0)
      - name: Cross-check e-process against confseq
        run: python scripts/confseq_crosscheck.py
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: results-confseq
          path: results/confseq_crosscheck.json
          if-no-files-found: warn

  report:
    needs: [test, confseq-crosscheck]
    if: always() && needs.test.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v5
        with:
          pattern: results-*
          path: results/
          merge-multiple: true
      - name: Build report
        run: |
          pip install -e .
          python scripts/build_report.py
      - uses: actions/upload-artifact@v5
        with:
          name: gatekeeper-report
          path: |
            report/index.html
            results/
