name: E2 collect (one earlier run)

# Re-collects the artifacts of an earlier e2-shards run with the CURRENT code (audit A68: a
# re-run of a failed collect job uses the old commit). Archives the raw files (already redacted in
# the shards) to raw-archive, then publishes the result files to e2-results. Costs nothing.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "e2-shards run id whose artifacts are collected"
        required: true

permissions:
  contents: write
  actions: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v6
        with:
          pattern: e2-shard-*
          path: .
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Raw evidence to raw-archive (merge and retry on a concurrent writer)
        run: |
          pip install -e .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/archive_raw.py --redacted-ok
      - name: Results to the e2-results branch
        if: always()
        run: |
          # publish_snapshot.sh resets and cleans the work tree: it runs AFTER the archive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ls results/pilot/ | head -50
          scripts/publish_snapshot.sh e2-results "E2 collect of run ${{ inputs.run_id }}" results/pilot
