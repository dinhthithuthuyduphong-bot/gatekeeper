name: E2 shards (SWE-bench-Live, XRepoSkill)

# E2 (docs/preregistration_e2.md) split over parallel jobs (GitHub-hosted runners: up to 20
# concurrent jobs on the Free plan, 6 h per job; docs.github.com/en/actions/reference/limits,
# snapshot in sources-snapshots/data/sources/github_actions_limits.json). Same pinned versions as
# the local runs (mini-swe-agent 2.4.6, litellm 1.106.6, swebench 5.0.2, Live fork ad79b85,
# docker 7.2.0, Python 3.11). Every shard runs the same pre-execution gate (scripts/preflight.py).
#
# mode=dryrun: scripted model + oracle skill on 2 tasks per shard, no credentials, 0 USD: checks
#   Docker, the Live harness, disk and the plumbing on the runner (expected: oracle resolved,
#   no-skill not, no run lost).
# mode=paid: needs repository secrets GCP_SA_KEY, VERTEXAI_PROJECT, VERTEXAI_LOCATION. ONE budget
#   for all shards: scripts/e2_ledger.py (branch e2-ledger) - each call reserves its worst case
#   (arms x tasks x cost limit) before it starts and settles its actual spend after, so the total
#   can never exceed the cap (audit A60). Raw files are redacted (no XRepoSkill text: no LICENSE)
#   before upload.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dryrun (0 USD) or paid"
        required: true
        default: "dryrun"
        type: choice
        options: ["dryrun", "paid"]
      shards:
        description: "Number of parallel jobs (<= 20)"
        required: true
        default: "2"
      seeds:
        description: "Seeds, interleaved on the same task batch"
        required: true
        default: "41 51 61"
      budget_usd:
        description: "Approved USD for this experiment (paid: E2 total, the XRepoSkill selection already spent is subtracted; dryrun: any cap, exercises the ledger)"
        required: true
      guidance_sha256:
        description: "SHA-256 the rebuilt guidance file must have (paid only)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: e2-shards
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.p.outputs.shards }}
    steps:
      - id: p
        run: |
          n="${{ inputs.shards }}"
          [ "$n" -ge 1 ] && [ "$n" -le 20 ] || { echo "shards must be 1..20"; exit 1; }
          # paid: the task -> shard assignment must be the same in every dispatch (resume, A60)
          [ "${{ inputs.mode }}" != paid ] || [ "$n" = 20 ] || { echo "paid runs use 20 shards"; exit 1; }
          echo "shards=$(python3 -c "import json; print(json.dumps(list(range($n))))")" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      K: ${{ matrix.shard }}
      N: ${{ inputs.shards }}
      VERTEXAI_PROJECT: ${{ secrets.VERTEXAI_PROJECT }}
      VERTEXAI_LOCATION: ${{ secrets.VERTEXAI_LOCATION }}
      HF_DATASETS_OFFLINE: "1"
    steps:
      - name: Free disk space for Docker images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          df -h /
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install (pinned, same versions as the local runs)
        run: |
          pip install -e . "swebench==5.0.2" "mini-swe-agent==2.4.6" "litellm==1.106.6" "docker==7.2.0" "pyyaml==6.0.3" "google-auth==2.62.0" mcp
          python -m venv livenv
          livenv/bin/pip install "swebench @ git+https://github.com/microsoft/SWE-bench-Live@ad79b850f15e33992e96f03f6e97f05ddf9aa0be" "docker==7.2.0"
      - name: Authenticate to Google Cloud (paid only)
        if: inputs.mode == 'paid'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Task rows and shard
        run: |
          git fetch -q origin data-snapshots
          git show origin/data-snapshots:data/instances/verified_pools.jsonl | grep '"test_cmds"' > e2_rows.jsonl
          python - <<'EOF'
          import json, os
          k, n, mode = int(os.environ["K"]), int(os.environ["N"]), "${{ inputs.mode }}"
          if mode == "paid":
              ids = json.load(open("configs/pools/e2_selected.json"))["instances"]
          else:  # dry run: 2 USABLE tasks of block 1 per shard (gold resolves on a runner)
              p = json.load(open("configs/pools/e2.json"))
              ok = set(json.load(open("results/pool_validation/e2/summary.json"))["usable"])
              ids = [i for i in p["random_order"] if i in ok][: 2 * n]
          mine = ids[k::n]
          json.dump({"instances": mine}, open("shard_pool.json", "w"))
          json.dump({"xreposkill": mine, "oracle-gold": mine}, open("shard_sets.json", "w"))
          print(f"shard {k}/{n}: {len(mine)} tasks")
          EOF
          # paid: results of earlier dispatches (same 20-shard assignment) so done tasks are not re-run
          if [ "${{ inputs.mode }}" = paid ] && git fetch -q origin e2-results 2>/dev/null; then
            mkdir -p results/pilot
            for f in $(git ls-tree --name-only origin/e2-results results/pilot/ | grep -E "/g2-e2-s[0-9]+-k$K-p[0-9]+\.json$"); do
              git show "origin/e2-results:$f" > "$f"; echo "resumed: $f"
            done
          fi
      - name: XRepoSkill guidance (paid only; rebuilt from the recorded rule ids, no LLM call)
        if: inputs.mode == 'paid'
        run: |
          [ -n "${{ inputs.guidance_sha256 }}" ] || { echo "paid runs need guidance_sha256 (execution note 7)"; exit 1; }
          git clone -q https://github.com/XREPOSKILL/XRepoSkill xrepo
          git -C xrepo checkout -q 26fd70345698108c0fdce2d8904293a38b9cd42f
          mkdir -p runs/e2_xreposkill
          python scripts/build_e2_guidance.py --clone xrepo --out runs/e2_xreposkill/guidance_by_instance.json \
            --expect-sha256 "${{ inputs.guidance_sha256 }}"
      - name: Gate (preflight)
        run: python scripts/preflight.py --ci
      - name: Run (seeds interleaved on the same task, one shared budget ledger)
        run: |
          set -u
          ARMS=2; BATCH=1; COST_LIMIT=1.0
          WORST=$(python -c "print($ARMS * $BATCH * $COST_LIMIT)")  # the driver's own worst-case bound
          if [ "${{ inputs.mode }}" = paid ]; then
            MODEL=gemini-flash-lite; SKILLS=configs/skills/xreposkill-e2.json; PREFIX=g2-e2; LEDGER=e2-ledger
            TOTAL=$(python -c "import json; print(round(float('${{ inputs.budget_usd }}') - json.load(open('results/e2_selection.json'))['spent_usd'], 4))")
          else
            MODEL=deterministic; SKILLS=configs/skills/oracle-gold.json; PREFIX=e2dry; LEDGER=e2-ledger-dryrun-${GITHUB_RUN_ID}
            TOTAL="${{ inputs.budget_usd }}"
          fi
          KEY="${GITHUB_RUN_ID}-k${K}"
          DEADLINE=$(python -c "import time; print(int(time.time() + (330 - 50) * 60))")
          echo "budget for ALL shards: $TOTAL USD (ledger $LEDGER); worst case per call $WORST USD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          left() { python scripts/missing_tasks.py "$1" shard_pool.json; }
          parts() { ls results/pilot/ 2>/dev/null | grep -cE "^$PREFIX-s[0-9]+-k$K-p[0-9]+\.json$" || true; }
          shard_spent() { python -c "import glob, json, re; print(round(sum(json.load(open(f)).get('spent_usd', 0) for f in glob.glob('results/pilot/$PREFIX-s*-k$K-p*.json') if re.search(r'-p\d+\.json$', f)), 6))"; }
          rundirs() { ls -d runs/$PREFIX-s*-k$K-p*/ 2>/dev/null | wc -l; }
          BASE=$(shard_spent)  # spend of earlier dispatches: already in their own ledger entries
          stop=0
          while [ $stop = 0 ]; do
            total=0; for s in ${{ inputs.seeds }}; do total=$((total + $(left $PREFIX-s$s-k$K))); done
            [ "$total" -gt 0 ] || break
            for s in ${{ inputs.seeds }}; do
              [ "$(left $PREFIX-s$s-k$K)" -gt 0 ] || continue
              python scripts/e2_ledger.py reserve --branch "$LEDGER" --key "$KEY" --usd "$WORST" \
                --cap "$TOTAL" --deadline-epoch "$DEADLINE" --wait-s 60 || { echo "[stop] budget or time"; stop=1; break; }
              before=$(parts); dirs_before=$(rundirs)
              # unrounded: the driver recomputes the same sum, so exactly one worst-case call fits
              CAP=$(python -c "import sys; sys.path.insert(0,'scripts'); import run_batched_pilot as r; print(repr(r.pilot_spent_total() + $WORST))")
              python scripts/run_batched_pilot.py --name $PREFIX-s$s-k$K --model $MODEL --model-seed $s \
                --skills $SKILLS --task-sets shard_sets.json --tasks-from shard_pool.json \
                --dataset-file e2_rows.jsonl --batch $BATCH --max-batches 1 --cap-usd $CAP --cost-limit $COST_LIMIT \
                --step-limit 250 --workers 2 --arm-parallel $ARMS --keep-images \
                --stop-after-min 330 --batch-min 50 \
                --harness-python livenv/bin/python --harness-namespace starryzhang
              SPENT=$(python -c "print(round($(shard_spent) - $BASE, 6))")
              if [ "$(parts)" -gt "$before" ]; then
                python scripts/e2_ledger.py settle --branch "$LEDGER" --key "$KEY" --spent "$SPENT"
              elif [ "$(rundirs)" -eq "$dirs_before" ]; then
                # the driver started nothing (time, disk or registry stop): nothing was spent
                python scripts/e2_ledger.py settle --branch "$LEDGER" --key "$KEY" --spent "$SPENT"
                echo "[stop] the driver started no call"; stop=1; break
              else
                # a call started but wrote no result: its spend is unknown, keep the worst case
                python scripts/e2_ledger.py settle --branch "$LEDGER" --key "$KEY" --spent "$SPENT" --keep-reserved
                echo "[stop] no result from the last call"; stop=1; break
              fi
            done
            # same rule as the local runs: a round that completes no task stops the shard
            # (e.g. an infrastructure failure that repeats), it is never retried without end
            now=0; for s in ${{ inputs.seeds }}; do now=$((now + $(left $PREFIX-s$s-k$K))); done
            [ $stop = 1 ] || [ "$now" -lt "$total" ] || { echo "[stop] no progress in a round"; stop=1; }
          done
          python scripts/e2_ledger.py total --branch "$LEDGER"
          python scripts/preflight.py --ci
      - name: Redact third-party text from raw files (paid only)
        if: always() && inputs.mode == 'paid'
        run: |
          python scripts/redact_third_party.py --guidance runs/e2_xreposkill/guidance_by_instance.json \
            --clone xrepo runs logs || { echo "LEAK: raw files will not be uploaded"; rm -rf runs logs; }
          rm -rf runs/e2_xreposkill
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: e2-shard-${{ matrix.shard }}
          path: |
            results/pilot/*-k${{ matrix.shard }}*.json
            runs/*-k${{ matrix.shard }}-p*/
            logs/run_evaluation/*-k${{ matrix.shard }}-p*/
          if-no-files-found: warn

  collect:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v6
        with:
          pattern: e2-shard-*
          path: .
          merge-multiple: true
      - name: Raw evidence to raw-archive (redacted in the shards; dry runs too)
        run: |
          pip install -e .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python scripts/archive_raw.py --redacted-ok
      - name: Results to the e2-results branch
        run: |
          ls results/pilot/ | head -50
          scripts/publish_snapshot.sh e2-results "E2 shards (${{ inputs.mode }}) run ${GITHUB_RUN_ID}" results/pilot
