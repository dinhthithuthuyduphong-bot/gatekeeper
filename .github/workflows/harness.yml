name: Harness smoke

# Official SWE-bench harness on 5 Verified tasks with gold vs empty patches: an end-to-end
# paired trial without any LLM. Results are published on the `harness-snapshots` branch.

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/harness_smoke.py"
      - "src/gatekeeper/loss.py"
      - ".github/workflows/harness.yml"

permissions:
  contents: write

concurrency:
  group: harness-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Free disk space for Docker images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          df -h /
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e . "swebench==5.0.2"
      - name: Record versions
        run: |
          pip show swebench | head -2
          docker version --format '{{.Server.Version}}'
      - name: Run paired gold/empty trials
        run: python scripts/harness_smoke.py --workers 2
      - name: Disk after run
        if: always()
        run: df -h / && docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}' | head -20
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: harness-smoke
          path: |
            results/harness_smoke.json
            logs/run_evaluation/**/report.json
            logs/run_evaluation/**/run_instance.log
          if-no-files-found: warn
      - name: Publish to harness-snapshots branch
        if: always()
        run: |
          test -f results/harness_smoke.json || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B harness-snapshots
          git add -f results/harness_smoke.json
          git commit -m "Harness smoke from ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})"
          git push -f origin harness-snapshots
