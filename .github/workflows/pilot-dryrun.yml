name: Pilot dry run

# Free end-to-end test of the pilot pipeline: mini-swe-agent with a scripted (deterministic)
# model in the real SWE-bench Docker images, an oracle skill that applies the gold patch as its
# edit program, the official harness, losses, paired differences and the e-process.
# No LLM is called. Expected: oracle skill Z = -0.667 on every instance.

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "scripts/run_pilot.py"
      - "src/gatekeeper/pilot.py"
      - "src/gatekeeper/harness.py"
      - "configs/skills/oracle-gold.json"
      - ".github/workflows/pilot-dryrun.yml"

permissions:
  contents: write

concurrency:
  group: pilot-dryrun
  cancel-in-progress: false

jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space for Docker images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e . "swebench==5.0.2" "mini-swe-agent==2.4.6"
      - name: Dry run (deterministic model, oracle skill)
        run: |
          python scripts/run_pilot.py --name dryrun --model deterministic \
            --skills configs/skills/oracle-gold.json \
            --instances psf__requests-1142,pallets__flask-5014 --workers 2
      - name: Check expected outcome
        run: |
          python - <<'EOF'
          import json
          d = json.load(open("results/pilot/dryrun.json"))
          s = d["skills"]["oracle-gold"]
          print(json.dumps(s, indent=1))
          assert len(s["pairs"]) == 2, "both instances must be paired"
          for p in s["pairs"]:
              assert p["loss_with"] == 0.0 and abs(p["loss_without"] - 2 / 3) < 1e-9, p
          print("dry run OK: oracle skill Z = -0.667 on every instance")
          EOF
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pilot-dryrun
          path: |
            results/pilot/
            runs/dryrun/**/overlay.yaml
            runs/dryrun/**/preds.json
            runs/dryrun/**/*.traj.json
            runs/dryrun/trials.jsonl
            runs/dryrun/**/minisweagent.log
          if-no-files-found: warn
      - name: Publish to pilot-snapshots branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B pilot-snapshots
          git add -f results/pilot/dryrun.json runs/dryrun/trials.jsonl
          git commit -m "Pilot dry run from ${GITHUB_SHA::7} (run ${GITHUB_RUN_ID})"
          git push -f origin pilot-snapshots
