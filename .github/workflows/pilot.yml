name: Pilot (paid, Vertex AI)

# COSTS MONEY. Manual only. Runs the R15 pilot with Gemini on Vertex AI.
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   GCP_WORKLOAD_IDENTITY_PROVIDER + GCP_SERVICE_ACCOUNT  (preferred, keyless)
#   or GCP_SA_KEY (service-account JSON key)
#   VERTEXAI_PROJECT, VERTEXAI_LOCATION
# See docs/vertex_setup.md.

on:
  workflow_dispatch:
    inputs:
      plan:
        description: "r15 = the original pilot job; swesmith-f1 = section 25 F1 (gskill agent, no skill, SWE-smith jinja)"
        required: true
        default: "r15"
        type: choice
        options: ["r15", "swesmith-f1", "swesmith-refl", "swesmith-learn", "swesmith-eval", "swesmith-republish", "swesmith-leakfree"]
      name:
        description: "Run name (results/pilot/<name>.json)"
        required: true
        default: "r15-a"
      model:
        description: "Key in configs/models/vertex_gemini.json"
        required: true
        default: "gemini-flash"
        type: choice
        options: ["gemini-flash", "gemini-flash-lite", "gemini-pro"]
      skills:
        description: "Comma-separated skill JSON files"
        required: true
        default: "configs/skills/null-guard.json,configs/skills/type-guard.json,configs/skills/exception-handling.json,configs/skills/validation-error.json"
      n:
        description: "Number of SWE-bench Verified instances"
        required: true
        default: "10"
      step_limit:
        description: "Max agent steps per instance (cost saver)"
        required: true
        default: "40"
      cost_limit:
        description: "USD cap per instance per arm (agent stops beyond it)"
        required: true
        default: "0.5"
      pool_tag:
        description: "Validated task pool (configs/pools/<tag>.json): default = 38 mixed tasks, g1 = tasks where the family skills activate"
        required: true
        default: "default"
        type: choice
        options: ["default", "g1"]
      half:
        description: "swesmith-learn only: 1 = first 300 metric calls, 2 = resume to 600"
        required: true
        default: "1"
        type: choice
        options: ["1", "2"]
      arm:
        description: "swesmith-leakfree only: none = no skill, skill = learned gskill skill"
        required: true
        default: "none"
        type: choice
        options: ["none", "skill"]
      budget_usd:
        description: "Hard budget for the whole run (USD)"
        required: true
        default: "15"

permissions:
  contents: write
  id-token: write
  actions: read

concurrency:
  group: pilot-paid
  cancel-in-progress: false

jobs:
  pilot:
    if: inputs.plan == 'r15'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      VERTEXAI_PROJECT: ${{ secrets.VERTEXAI_PROJECT }}
      VERTEXAI_LOCATION: ${{ secrets.VERTEXAI_LOCATION }}
      HAS_WIF: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER != '' }}
      HAS_KEY: ${{ secrets.GCP_SA_KEY != '' }}
    steps:
      - name: Free disk space for Docker images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
      - uses: actions/checkout@v5
      - name: Authenticate to Google Cloud (workload identity)
        if: env.HAS_WIF == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - name: Authenticate to Google Cloud (service-account key)
        if: env.HAS_WIF != 'true' && env.HAS_KEY == 'true'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Fail early without Vertex AI credentials
        if: env.HAS_WIF != 'true' && env.HAS_KEY != 'true'
        run: echo "No GCP credentials configured; see docs/vertex_setup.md" && exit 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e . "swebench==5.0.2" "mini-swe-agent==2.4.6" "litellm==1.106.6" mcp google-auth
      - name: Fetch validated task pool
        run: |
          git fetch origin pilot-snapshots
          tag="${{ inputs.pool_tag }}"
          git show "origin/pilot-snapshots:results/pool_validation/$tag/summary.json" > pool.json 2>/dev/null || \
            { [ "$tag" = default ] && git show origin/pilot-snapshots:results/pool_validation/summary.json > pool.json; } || \
            { echo "pool '$tag' not validated yet: run 'Validate pilot pool' with tag=$tag"; exit 1; }
          python -c "import json; print(json.load(open('pool.json'))['n_usable'], 'usable tasks')"
      - name: Run pilot
        run: |
          python scripts/run_pilot.py --name "${{ inputs.name }}" --model "${{ inputs.model }}" \
            --skills "${{ inputs.skills }}" --n "${{ inputs.n }}" --pool pool.json \
            --cost-limit "${{ inputs.cost_limit }}" --budget-usd "${{ inputs.budget_usd }}" \
            --step-limit "${{ inputs.step_limit }}" --workers 2
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pilot-${{ inputs.name }}
          path: |
            results/pilot/
            runs/${{ inputs.name }}/
          if-no-files-found: warn
      - name: Publish to pilot-snapshots branch
        if: success()
        run: scripts/publish_snapshot.sh pilot-snapshots "Pilot ${{ inputs.name }} (${{ inputs.model }}) run ${GITHUB_RUN_ID}" "results/pilot/${{ inputs.name }}.json" "runs/${{ inputs.name }}/trials.jsonl"

  swesmith_f1:
    # docs/preregistration_main.md section 25 F1. Cap = inputs.budget_usd (registered: 2.0).
    if: startsWith(inputs.plan, 'swesmith-') && inputs.plan != 'swesmith-republish'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      VERTEXAI_PROJECT: ${{ secrets.VERTEXAI_PROJECT }}
      VERTEXAI_LOCATION: ${{ secrets.VERTEXAI_LOCATION }}
      HAS_KEY: ${{ secrets.GCP_SA_KEY != '' }}
      GEPA_COMMIT: 8c7b697a71977980afc7537dac0881e784eef99f
      IMG: swebench/swesmith.x86_64.pallets_1776_jinja.ada0a9a6
    steps:
      - name: Free disk space for Docker images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Preflight gate
        run: pip -q install -e . && python scripts/preflight.py --ci || exit 7
      - name: Fail early without Vertex AI credentials
        if: env.HAS_KEY != 'true'
        run: echo "No GCP_SA_KEY" && exit 1
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: gskill environment (pinned as in section 25)
        run: |
          git clone -q https://github.com/gepa-ai/gepa /tmp/gepa && git -C /tmp/gepa checkout -q "$GEPA_COMMIT"
          python -m venv /tmp/venv
          /tmp/venv/bin/pip -q install "swesmith==0.0.9" "swebench==4.1.0" "mini-swe-agent==1.17.5" docker pyyaml unidiff litellm google-auth python-dotenv datasets
          /tmp/venv/bin/pip -q install -e /tmp/gepa
          python - <<'EOF'
          import json
          from gatekeeper.pilot import litellm_registry, load_model_specs
          specs = load_model_specs("configs/models/vertex_gemini.json")
          reg = {}
          for k in ("gemini-flash-lite", "gemini-pro"):
              reg.update(litellm_registry(specs[k]))
          json.dump(reg, open("/tmp/registry.json", "w"), indent=1)
          print(sorted(reg))
          EOF
      - name: Task rows (gskill split) and image with the instance branches
        run: |
          git fetch -q origin data-snapshots
          git show origin/data-snapshots:data/instances/swesmith_pallets__jinja.jsonl > /tmp/rows.jsonl
          wc -l /tmp/rows.jsonl
          docker pull -q "mirror.gcr.io/$IMG"
          git clone -q --mirror https://github.com/swesmith/pallets__jinja.ada0a9a6 /tmp/img/mirror.git
          printf 'FROM mirror.gcr.io/%s\nCOPY mirror.git /opt/mirror.git\nRUN chmod -R a+rX /opt/mirror.git && cd /testbed && git remote set-url origin /opt/mirror.git && git fetch -q origin\n' "$IMG" > /tmp/img/Dockerfile
          docker build -q -t "$IMG:latest" /tmp/img
      - name: Run F1 (no-skill arm, capped)
        if: inputs.plan == 'swesmith-f1'
        run: |
          mkdir -p /tmp/work results
          cd /tmp/work
          PYTHONPATH=/tmp/gepa/src/gepa/gskill:$GITHUB_WORKSPACE/scripts /tmp/venv/bin/python \
            $GITHUB_WORKSPACE/scripts/f1_probe.py --rows /tmp/rows.jsonl --split test \
            --model vertex_ai/gemini-3.1-flash-lite --seed 41 --cost-limit 0.30 --cap "${{ inputs.budget_usd }}" \
            --registry $GITHUB_WORKSPACE/tests/fixtures/e1_litellm_registry.json \
            --gskill-yaml /tmp/gepa/src/gepa/gskill/gskill/mini_swe_agent_config/mini.yaml \
            --out $GITHUB_WORKSPACE/results/f1_probe.json
      - name: Run reflection cost probe (note 25-3, capped)
        if: inputs.plan == 'swesmith-refl'
        run: |
          mkdir -p /tmp/work results
          cd /tmp/work
          PYTHONPATH=/tmp/gepa/src/gepa/gskill:$GITHUB_WORKSPACE/scripts /tmp/venv/bin/python \
            $GITHUB_WORKSPACE/scripts/reflection_cost_probe.py --rows /tmp/rows.jsonl --n 3 \
            --model vertex_ai/gemini-3.1-flash-lite --reflection-model vertex_ai/gemini-3.1-pro-preview \
            --seed 41 --cost-limit 0.30 --cap "${{ inputs.budget_usd }}" --registry /tmp/registry.json \
            --gskill-yaml /tmp/gepa/src/gepa/gskill/gskill/mini_swe_agent_config/mini.yaml \
            --run-dir /tmp/work/refl --out $GITHUB_WORKSPACE/results/reflection_cost_probe.json
      - name: Learn a gskill skill (section 25 step 2, half ${{ inputs.half }}, capped)
        if: inputs.plan == 'swesmith-learn'
        run: |
          mkdir -p /tmp/work results && cd /tmp/work
          git -C $GITHUB_WORKSPACE fetch -q origin pilot-snapshots || true
          if [ "${{ inputs.half }}" = "1" ]; then
            BEFORE=0; CALLS=300; EXTRA=""
          else
            git -C $GITHUB_WORKSPACE show origin/pilot-snapshots:results/s25_learn_run.tar.gz > /tmp/run.tgz
            tar -xzf /tmp/run.tgz -C /tmp/work
            BEFORE=$(python -c "import json; print(json.load(open('/dev/stdin'))['spent_total'])" < <(git -C $GITHUB_WORKSPACE show origin/pilot-snapshots:results/s25_learn_ledger_h1.json))
            RUN=$(ls -d gepa_results/logs/run_jinja_* | head -1)
            CALLS=600; EXTRA="--resume $RUN"
          fi
          echo "spent before: $BEFORE; max metric calls: $CALLS"
          rc=0
          PYTHONPATH=/tmp/gepa/src/gepa/gskill /tmp/venv/bin/python $GITHUB_WORKSPACE/scripts/gskill_learn.py \
            --cap "${{ inputs.budget_usd }}" --spent-before "$BEFORE" \
            --ledger $GITHUB_WORKSPACE/results/s25_learn_ledger_h${{ inputs.half }}.json --registry /tmp/registry.json -- \
            --repo pallets__jinja --train-size 200 --val-size 50 --test-size 100 \
            --model vertex_ai/gemini-3.1-flash-lite --reflection-model vertex_ai/gemini-3.1-pro-preview \
            --workers 6 --max-metric-calls $CALLS --timeout 18000 $EXTRA || rc=$?
          echo "exit $rc"
          RUN=$(ls -d gepa_results/logs/run_jinja_* | sort | tail -1)  # newest: --resume writes a new run dir (A95)
          tar -czf $GITHUB_WORKSPACE/results/s25_learn_run.tar.gz gepa_results/logs/$(basename $RUN)
          cp $RUN/prompts/best_skills.txt $GITHUB_WORKSPACE/results/s25_best_skills.txt || true
          cp $RUN/summary.json $GITHUB_WORKSPACE/results/s25_learn_summary_h${{ inputs.half }}.json || true
          ls -la $GITHUB_WORKSPACE/results/s25_*
      - name: Evaluate the learned skill (section 25 step 2, capped)
        if: inputs.plan == 'swesmith-eval'
        run: |
          mkdir -p /tmp/work results && cd /tmp/work
          git -C $GITHUB_WORKSPACE fetch -q origin pilot-snapshots
          git -C $GITHUB_WORKSPACE show origin/pilot-snapshots:results/s25_best_skills.txt > /tmp/skills.txt
          wc -c /tmp/skills.txt
          PYTHONPATH=/tmp/gepa/src/gepa/gskill:$GITHUB_WORKSPACE/scripts /tmp/venv/bin/python \
            $GITHUB_WORKSPACE/scripts/f1_probe.py --rows /tmp/rows.jsonl --split test --skills-file /tmp/skills.txt \
            --model vertex_ai/gemini-3.1-flash-lite --seed 41 --cost-limit 0.30 --cap "${{ inputs.budget_usd }}" \
            --registry $GITHUB_WORKSPACE/tests/fixtures/e1_litellm_registry.json \
            --gskill-yaml /tmp/gepa/src/gepa/gskill/gskill/mini_swe_agent_config/mini.yaml \
            --out $GITHUB_WORKSPACE/results/f1_skill_probe.json
      - name: Leak-free arm (section 25 step 3, capped)
        if: inputs.plan == 'swesmith-leakfree'
        run: |
          mkdir -p /tmp/work results && cd /tmp/work
          SK=""
          if [ "${{ inputs.arm }}" = "skill" ]; then
            git -C $GITHUB_WORKSPACE fetch -q origin pilot-snapshots
            git -C $GITHUB_WORKSPACE show origin/pilot-snapshots:results/s25_best_skills.txt > /tmp/skills.txt
            cmp /tmp/skills.txt $GITHUB_WORKSPACE/docs/skills/gskill/jinja_best_skills.txt
            SK="--skills-file /tmp/skills.txt"
          fi
          PYTHONPATH=/tmp/gepa/src/gepa/gskill:$GITHUB_WORKSPACE/scripts /tmp/venv/bin/python \
            $GITHUB_WORKSPACE/scripts/f1_probe.py --rows /tmp/rows.jsonl --split test --leak-free $SK \
            --model vertex_ai/gemini-3.1-flash-lite --seed 41 --cost-limit 0.30 --cap "${{ inputs.budget_usd }}" \
            --registry $GITHUB_WORKSPACE/tests/fixtures/e1_litellm_registry.json \
            --gskill-yaml /tmp/gepa/src/gepa/gskill/gskill/mini_swe_agent_config/mini.yaml \
            --out $GITHUB_WORKSPACE/results/s25_leakfree_${{ inputs.arm }}.json
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: swesmith-${{ inputs.plan }}-${{ inputs.half }}-${{ inputs.arm }}
          path: |
            results/f1_probe.json
            results/reflection_cost_probe.json
            /tmp/work/logs/
            /tmp/work/refl/
            /tmp/work/gepa_results/
            results/s25_*
            results/s25_leakfree_*
          if-no-files-found: warn
      - name: Publish to pilot-snapshots branch
        if: always()
        run: |
          # only files that exist: git add of a missing path fails the publish
          files=$(ls results/f1_probe.json results/reflection_cost_probe.json results/s25_learn_run.tar.gz results/s25_best_skills.txt results/s25_learn_ledger_h1.json results/s25_learn_ledger_h2.json results/s25_learn_summary_h1.json results/s25_learn_summary_h2.json results/f1_skill_probe.json results/s25_leakfree_none.json results/s25_leakfree_skill.json 2>/dev/null || true)
          echo "publishing: $files"
          scripts/publish_snapshot.sh pilot-snapshots "Section 25 ${{ inputs.plan }} ${{ inputs.half }} run ${GITHUB_RUN_ID}" $files

  swesmith_republish:
    # A94: re-publish the results of an earlier swesmith run from its artifact (no model call).
    # inputs.name = the run id; inputs.half = which learning half the artifact belongs to.
    if: inputs.plan == 'swesmith-republish'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: swesmith-swesmith-learn-${{ inputs.half }}
          run-id: ${{ inputs.name }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/art
      - name: Publish results/s25_* from the artifact
        run: |
          find /tmp/art -maxdepth 4 -name 's25_*' | head -20
          mkdir -p results
          src=$(find /tmp/art -type d -name results | head -1)
          cp "$src"/s25_learn_ledger_h* results/
          RUN=$(find /tmp/art -type d -path '*gepa_results/logs/run_jinja_*' -prune | sort | tail -1)  # newest (A95)
          echo "newest run dir: $RUN"
          cp "$RUN/summary.json" "results/s25_learn_summary_h${{ inputs.half }}.json"
          cp "$RUN/prompts/best_skills.txt" results/s25_best_skills.txt
          (cd "$(dirname "$(dirname "$(dirname "$RUN")")")" && tar -czf "$GITHUB_WORKSPACE/results/s25_learn_run.tar.gz" "gepa_results/logs/$(basename "$RUN")")
          python -c "import json; print(json.load(open('results/s25_learn_summary_h${{ inputs.half }}.json'))['extra_info'])"
          ls -la results/s25_*
          files=$(ls results/s25_learn_run.tar.gz results/s25_best_skills.txt results/s25_learn_ledger_h1.json results/s25_learn_ledger_h2.json results/s25_learn_summary_h1.json results/s25_learn_summary_h2.json 2>/dev/null || true)
          scripts/publish_snapshot.sh pilot-snapshots "Section 25 republish of run ${{ inputs.name }} (half ${{ inputs.half }})" $files
