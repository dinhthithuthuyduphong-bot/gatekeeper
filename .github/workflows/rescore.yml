name: Harness rescoring (sections 26-28, no LLM)

# Execution note 26-2 / 27-2 / 28-1 (docs/preregistration_main.md): gold patch x3 (section 26) and
# no-op patch x1 (section 27a) on a GitHub runner, whose evaluation containers have full network
# access (as when E2 was scored). Same harness versions as E2. No model calls, no secrets.
# Results and a tarball of the harness logs go to the rescore-results branch.

on:
  workflow_dispatch:
    inputs:
      shards:
        description: number of shards (1..10)
        required: true
        default: "10"

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.p.outputs.shards }}
    steps:
      - id: p
        run: |
          n="${{ inputs.shards }}"
          [ "$n" -ge 1 ] && [ "$n" -le 10 ] || { echo "shards must be 1..10"; exit 1; }
          echo "shards=$(python3 -c "import json; print(json.dumps(list(range($n))))")" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      K: ${{ matrix.shard }}
      N: ${{ inputs.shards }}
    steps:
      - name: Free disk space for Docker images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          df -h /
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install (pinned, same versions as E2)
        run: |
          pip install -e . "swebench==5.0.2" "docker==7.2.0" "pyyaml==6.0.3"
          python -m venv livenv
          livenv/bin/pip install "swebench @ git+https://github.com/microsoft/SWE-bench-Live@ad79b850f15e33992e96f03f6e97f05ddf9aa0be" "docker==7.2.0"
      - name: Task rows (data-snapshots; identical to the local files, note 26-2)
        run: |
          git fetch -q origin data-snapshots
          git show origin/data-snapshots:data/instances/verified_pools.jsonl > rows_a.jsonl
          git show origin/data-snapshots:data/instances/live_blocks_cd.jsonl > rows_b.jsonl
      - name: Gold patch x3 (section 26, runner environment)
        run: |
          python scripts/gold_rescore.py --rows rows_a.jsonl rows_b.jsonl \
            --live-python livenv/bin/python --verified-python "$(which python)" \
            --shard "$K" --of "$N" --out "results/harness_gold_gh_k$K.json"
      - name: No-op patch x1 (section 27a, runner environment)
        if: always()
        run: |
          python scripts/noop_rescore.py --rows rows_a.jsonl rows_b.jsonl \
            --live-python livenv/bin/python --verified-python "$(which python)" \
            --shard "$K" --of "$N" --out "results/harness_noop_gh_k$K.json"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rescore-shard-${{ matrix.shard }}
          path: |
            results/harness_gold_gh_k${{ matrix.shard }}.json
            results/harness_noop_gh_k${{ matrix.shard }}.json
            logs/run_evaluation/gold-*/
            logs/run_evaluation/noop-*/
          if-no-files-found: warn

  collect:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          pattern: rescore-shard-*
          path: .
          merge-multiple: true
      - name: Merge shard results
        run: |
          python3 - <<'EOF'
          import glob, json
          for kind in ("gold", "noop"):
              out = {}
              for f in sorted(glob.glob(f"results/harness_{kind}_gh_k*.json")):
                  out.update(json.load(open(f)))
              json.dump(out, open(f"results/harness_{kind}_gh.json", "w"), indent=1)
              print(kind, len(out))
          EOF
      - name: Publish to the rescore-results branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/pub && cp results/harness_gold_gh.json results/harness_noop_gh.json /tmp/pub/
          tar -czf /tmp/pub/rescore_logs.tar.gz logs/run_evaluation || true
          git fetch -q origin rescore-results || true
          git checkout -q --orphan rescore-results-new
          git rm -rq --cached . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/pub/* .
          git add harness_gold_gh.json harness_noop_gh.json rescore_logs.tar.gz
          git commit -qm "Harness rescoring run ${GITHUB_RUN_ID}"
          git push -f origin HEAD:rescore-results
