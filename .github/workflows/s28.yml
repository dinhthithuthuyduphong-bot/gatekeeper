name: Section 28m step 2 - rescore saved agent patches with network (no LLM)

# Section 28m step 2 (docs/preregistration_main.md): the saved agent patches listed in
# results/s28_manifest.json.gz, scored once each on a GitHub runner (evaluation containers with full
# network access, as when E2 was scored). Same harness versions as E2. No model calls, no secrets.

on:
  workflow_dispatch:
    inputs:
      shards:
        description: number of shards (1..20)
        required: true
        default: "20"

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.p.outputs.shards }}
    steps:
      - id: p
        run: |
          n="${{ inputs.shards }}"
          [ "$n" -ge 1 ] && [ "$n" -le 20 ] || { echo "shards must be 1..20"; exit 1; }
          echo "shards=$(python3 -c "import json; print(json.dumps(list(range($n))))")" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    env:
      K: ${{ matrix.shard }}
      N: ${{ inputs.shards }}
    steps:
      - name: Free disk space for Docker images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
          df -h /
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install (pinned, same versions as E2)
        run: |
          pip install -e . "swebench==5.0.2" "docker==7.2.0" "pyyaml==6.0.3"
          python -m venv livenv
          livenv/bin/pip install "swebench @ git+https://github.com/microsoft/SWE-bench-Live@ad79b850f15e33992e96f03f6e97f05ddf9aa0be" "docker==7.2.0"
      - name: Task rows (data-snapshots; identical to the local files, note 26m-2)
        run: |
          git fetch -q origin data-snapshots
          git show origin/data-snapshots:data/instances/verified_pools.jsonl > rows_a.jsonl
          git show origin/data-snapshots:data/instances/live_blocks_cd.jsonl > rows_b.jsonl
      - name: Rescore saved agent patches (section 28m step 2)
        run: |
          python scripts/s28_rescore.py --rows rows_a.jsonl rows_b.jsonl \
            --live-python livenv/bin/python --verified-python "$(which python)" \
            --shard "$K" --of "$N"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: s28-shard-${{ matrix.shard }}
          path: |
            results/s28_rescored_k${{ matrix.shard }}.json
            logs/run_evaluation/s28-*/
          if-no-files-found: warn

  collect:
    needs: run
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        with:
          pattern: s28-shard-*
          path: .
          merge-multiple: true
      - name: Merge shard results
        run: |
          python3 - <<'EOF'
          import glob, json
          out = {}
          for f in sorted(glob.glob("results/s28_rescored_k*.json")):
              out.update(json.load(open(f)))
          json.dump(out, open("results/s28_rescored.json", "w"), indent=1)
          print(len(out))
          EOF
      - name: Publish to the s28-results branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/pub && cp results/s28_rescored.json /tmp/pub/
          tar -czf /tmp/pub/s28_logs.tar.gz logs/run_evaluation || true
          git fetch -q origin s28-results || true
          git checkout -q --orphan s28-results-new
          git rm -rq --cached . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/pub/* .
          git add s28_rescored.json s28_logs.tar.gz
          git commit -qm "Section 28m step 2 run ${GITHUB_RUN_ID}"
          git push -f origin HEAD:s28-results
