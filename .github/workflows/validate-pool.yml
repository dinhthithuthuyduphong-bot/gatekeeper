name: Validate pilot pool

# Free: checks every task of configs/pools/<tag>.json with the official harness (gold twice for
# flakiness, no-op once for a clean no-skill arm). Results on the pilot-snapshots branch under
# results/pool_validation/.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Pool to validate: configs/pools/<tag>.json"
        required: true
        default: "g1"
  push:
    branches: ["main"]
    paths:
      - "configs/pools/g1.json"
      - "scripts/validate_pool.py"
      - ".github/workflows/validate-pool.yml"

permissions:
  contents: write

jobs:
  shard:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Free disk space for Docker images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af || true
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e . "swebench==5.0.2"
      - name: Validate shard
        run: python scripts/validate_pool.py --tag "${{ inputs.tag || 'g1' }}" --shard ${{ matrix.shard }} --shards 8 --workers 2
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: pool-shard-${{ matrix.shard }}
          path: results/pool_validation/${{ inputs.tag || 'g1' }}/shard${{ matrix.shard }}.json
          if-no-files-found: warn

  merge:
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v6
        with:
          pattern: pool-shard-*
          path: results/pool_validation/${{ inputs.tag || 'g1' }}/
          merge-multiple: true
      - name: Merge
        run: |
          pip install -e .
          python scripts/validate_pool.py --tag "${{ inputs.tag || 'g1' }}" --merge
      - name: Publish to pilot-snapshots branch
        run: scripts/publish_snapshot.sh pilot-snapshots "Pool validation ${{ inputs.tag || 'g1' }} (run ${GITHUB_RUN_ID})" results/pool_validation
