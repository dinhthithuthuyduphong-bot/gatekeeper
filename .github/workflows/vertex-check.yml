name: Vertex credentials check

# Which service account / key the GCP_SA_KEY secret holds, whether VERTEXAI_PROJECT and
# VERTEXAI_LOCATION are set, and whether that account may call the pilot model (one request of a
# few tokens). Prints identifiers only (client_email, first 8 characters of private_key_id),
# never key material. docs/vertex_setup.md records the result.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VERTEXAI_PROJECT: ${{ secrets.VERTEXAI_PROJECT }}
      VERTEXAI_LOCATION: ${{ secrets.VERTEXAI_LOCATION }}
      HAS_KEY: ${{ secrets.GCP_SA_KEY != '' }}
    steps:
      - name: Which secrets are set
        run: |
          echo "GCP_SA_KEY set: $HAS_KEY"
          [ -n "$VERTEXAI_PROJECT" ] && echo "VERTEXAI_PROJECT set" || echo "VERTEXAI_PROJECT NOT set"
          [ -n "$VERTEXAI_LOCATION" ] && echo "VERTEXAI_LOCATION set" || echo "VERTEXAI_LOCATION NOT set"
      - uses: google-github-actions/auth@v2
        if: env.HAS_KEY == 'true'
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Identify the key and call the model once
        if: env.HAS_KEY == 'true'
        run: |
          pip -q install "litellm==1.106.6" "google-auth==2.62.0"
          python - <<'EOF'
          import json, os
          d = json.load(open(os.environ["GOOGLE_APPLICATION_CREDENTIALS"]))
          print("service account:", d.get("client_email"))
          print("key id (first 8):", (d.get("private_key_id") or "")[:8])
          print("project in key:", d.get("project_id"))
          import litellm
          r = litellm.completion(
              model="vertex_ai/gemini-3.1-flash-lite",
              messages=[{"role": "user", "content": "Reply with the single word OK."}],
              max_tokens=5,
              vertex_project=os.environ.get("VERTEXAI_PROJECT") or d.get("project_id"),
              vertex_location=os.environ.get("VERTEXAI_LOCATION") or "global",
          )
          print("model call OK:", r.choices[0].message.content, "| tokens", r.usage.prompt_tokens, r.usage.completion_tokens)
          EOF
      - name: List partner and open models in Model Garden (no model call, no endpoint, 0 USD)
        if: env.HAS_KEY == 'true'
        run: |
          python - <<'EOF'
          # ListPublisherModels (Vertex AI v1beta1): names, launch stage, open-source category and the
          # supported actions of each model card, to pick a per-token (MaaS) model without guessing
          # its id. Read-only; deploys nothing.
          import json, os, urllib.request
          import google.auth, google.auth.transport.requests
          creds, proj = google.auth.default(scopes=["https://www.googleapis.com/auth/cloud-platform"])
          creds.refresh(google.auth.transport.requests.Request())
          project = os.environ.get("VERTEXAI_PROJECT") or proj
          for pub in ("deepseek-ai", "qwen", "meta", "mistralai", "anthropic"):
              url = f"https://aiplatform.googleapis.com/v1beta1/publishers/{pub}/models?pageSize=200&listAllVersions=false"
              req = urllib.request.Request(url, headers={"Authorization": f"Bearer {creds.token}", "x-goog-user-project": project})
              try:
                  d = json.load(urllib.request.urlopen(req, timeout=60))
              except Exception as e:  # noqa: BLE001
                  print(f"[{pub}] list failed: {type(e).__name__}: {str(e)[:200]}")
                  continue
              ms = d.get("publisherModels", [])
              print(f"[{pub}] {len(ms)} models")
              for m in ms:
                  acts = sorted((m.get("supportedActions") or {}).keys())
                  print(f"  {m.get('name')} | version {m.get('versionId')} | {m.get('launchStage')} | {m.get('openSourceCategory')} | actions {acts}")
          EOF
      - name: Second-model probe, Claude Haiku 5.5 (item 2.3; a few calls, < 0.01 USD)
        if: env.HAS_KEY == 'true'
        run: |
          python - <<'EOF'
          # Checks the conditions registered for the second model (docs/model_switch_checklist.md B4,
          # B5; cache for the cost estimate): reachable, tool calls (parallel), seed, prompt caching.
          # Prints outcomes and token counts only.
          import json, os
          import litellm
          M = "vertex_ai/claude-haiku-5-5"
          kw = dict(vertex_project=os.environ.get("VERTEXAI_PROJECT"), vertex_location="global")
          def run(name, **a):
              try:
                  r = litellm.completion(model=M, **kw, **a)
                  u = r.usage
                  extra = {k: getattr(u, k, None) for k in ("cache_creation_input_tokens", "cache_read_input_tokens")}
                  return r, f"{name}: OK | in {u.prompt_tokens} out {u.completion_tokens} {extra}"
              except Exception as e:  # noqa: BLE001
                  return None, f"{name}: ERROR {type(e).__name__}: {str(e)[:300]}"
          r, s = run("1 reachable", messages=[{"role": "user", "content": "Reply with the single word OK."}], max_tokens=5); print(s)
          tool = {"type": "function", "function": {"name": "bash", "description": "Run a bash command",
                  "parameters": {"type": "object", "properties": {"command": {"type": "string"}}, "required": ["command"]}}}
          r, s = run("2 tools", messages=[{"role": "user", "content": "Use the bash tool twice in parallel: run `ls` and run `pwd`. Call both tools in this one response."}],
                     tools=[tool], parallel_tool_calls=True, max_tokens=200); print(s)
          if r is not None:
              calls = r.choices[0].message.tool_calls or []
              print("  tool calls in one response:", len(calls), [json.loads(c.function.arguments) for c in calls])
          r, s = run("3 seed (no drop_params)", messages=[{"role": "user", "content": "Say hi."}], max_tokens=5, seed=41); print(s)
          long = "Reference text for caching. " + " ".join(f"item-{i} alpha beta gamma delta" for i in range(900))
          msgs = [{"role": "system", "content": [{"type": "text", "text": long, "cache_control": {"type": "ephemeral"}}]},
                  {"role": "user", "content": "Reply OK."}]
          r, s = run("4a cache write", messages=msgs, max_tokens=5); print(s)
          r, s = run("4b cache read", messages=msgs, max_tokens=5); print(s)
          EOF
